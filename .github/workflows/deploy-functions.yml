name: Deploy Azure Functions

on:
  workflow_run:
    workflows: ["Build and Test"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'kirospotibot-functions-flex'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './KiroSpotiBot.Functions'
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build solution
      run: dotnet build --configuration Release --no-restore
    
    - name: Publish Azure Functions
      run: |
        dotnet publish ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }} \
          --configuration Release \
          --output ./publish
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure Functions
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ./publish
    
    - name: Configure App Settings from Key Vault
      uses: Azure/cli@v2
      with:
        inlineScript: |
          az functionapp config appsettings set \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings \
              "AZURE_STORAGE_CONNECTION_STRING=@Microsoft.KeyVault(SecretUri=${{ secrets.KEYVAULT_URI }}secrets/AzureStorageConnectionString/)" \
              "TELEGRAM_BOT_TOKEN=@Microsoft.KeyVault(SecretUri=${{ secrets.KEYVAULT_URI }}secrets/TelegramBotToken/)" \
              "SPOTIFY_CLIENT_ID=@Microsoft.KeyVault(SecretUri=${{ secrets.KEYVAULT_URI }}secrets/SpotifyClientId/)" \
              "SPOTIFY_CLIENT_SECRET=@Microsoft.KeyVault(SecretUri=${{ secrets.KEYVAULT_URI }}secrets/SpotifyClientSecret/)" \
              "ENCRYPTION_KEY=@Microsoft.KeyVault(SecretUri=${{ secrets.KEYVAULT_URI }}secrets/EncryptionKey/)" \
              "SENTRY_DSN=@Microsoft.KeyVault(SecretUri=${{ secrets.KEYVAULT_URI }}secrets/SentryDsn/)"
      env:
        AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
